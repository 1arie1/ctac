<svg xmlns="http://www.w3.org/2000/svg" width="760" height="440" viewBox="0 0 760 440" role="img" aria-label="Thin Gated SSA incoming cases">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0369a1"/>
    </marker>
    <style>
      .node { fill: #f8fafc; stroke: #64748b; stroke-width: 2; rx: 8; }
      .entry { fill: #eff6ff; stroke: #0369a1; stroke-width: 2.4; rx: 8; }
      .ctrl { fill: #ecfdf5; stroke: #047857; stroke-width: 2.4; rx: 8; }
      .target { fill: #fefce8; stroke: #a16207; stroke-width: 2.4; rx: 8; }
      .drop { fill: #fff7ed; stroke: #c2410c; stroke-width: 2; rx: 8; }
      .edge { stroke: #334155; stroke-width: 2.1; fill: none; marker-end: url(#arrow); }
      .direct { stroke: #0369a1; stroke-width: 3.1; fill: none; marker-end: url(#arrow-blue); }
      .dropped { stroke: #c2410c; stroke-width: 2.1; stroke-dasharray: 7 6; fill: none; marker-end: url(#arrow); }
      .text { font-family: Menlo, Consolas, monospace; font-size: 18px; fill: #0f172a; text-anchor: middle; dominant-baseline: middle; }
      .label { font-family: Libertinus Serif, Georgia, serif; font-size: 16px; fill: #334155; text-anchor: middle; }
      .blue { fill: #0369a1; font-weight: 700; }
      .orange { fill: #c2410c; font-weight: 700; }
      .label-bg { fill: white; stroke: #e2e8f0; stroke-width: 1; rx: 5; }
      .caption { font-family: Libertinus Serif, Georgia, serif; font-size: 18px; font-weight: 700; fill: #0369a1; text-anchor: middle; }
    </style>
  </defs>

  <text class="caption" x="380" y="28">Thin GSSA keeps the incoming cases to n and drops bypass cases to undef</text>

  <rect class="entry" x="330" y="55" width="100" height="48"/>
  <text class="text" x="380" y="79">entry</text>

  <rect class="ctrl" x="180" y="145" width="100" height="48"/>
  <text class="text" x="230" y="169">a</text>

  <rect class="ctrl" x="480" y="145" width="100" height="48"/>
  <text class="text" x="530" y="169">b</text>

  <rect class="target" x="330" y="245" width="100" height="48"/>
  <text class="text" x="380" y="269">n</text>

  <rect class="drop" x="90" y="245" width="100" height="48"/>
  <text class="text" x="140" y="269">x</text>

  <rect class="drop" x="570" y="245" width="100" height="48"/>
  <text class="text" x="620" y="269">y</text>

  <rect class="node" x="50" y="330" width="140" height="48"/>
  <text class="text" x="120" y="354">elsewhere</text>

  <rect class="node" x="570" y="330" width="140" height="48"/>
  <text class="text" x="640" y="354">elsewhere</text>

  <path class="direct" d="M 335 102 C 300 120 265 130 240 145"/>
  <rect class="label-bg" x="283" y="109" width="34" height="22"/>
  <text class="label blue" x="300" y="126">c1</text>
  <path class="direct" d="M 425 102 C 460 120 500 130 524 145"/>
  <rect class="label-bg" x="454" y="109" width="58" height="22"/>
  <text class="label blue" x="483" y="126">not c1</text>

  <path class="edge" d="M 260 193 C 290 220 326 236 360 245"/>
  <path class="edge" d="M 500 193 C 470 220 434 236 400 245"/>

  <path class="dropped" d="M 200 193 C 170 216 150 232 142 245"/>
  <rect class="label-bg" x="122" y="204" width="34" height="22"/>
  <text class="label orange" x="139" y="221">c2</text>
  <path class="dropped" d="M 560 193 C 590 216 612 232 620 245"/>
  <rect class="label-bg" x="608" y="204" width="34" height="22"/>
  <text class="label orange" x="625" y="221">c3</text>

  <path class="edge" d="M 380 293 L 380 330"/>
  <path class="edge" d="M 140 293 L 122 330"/>
  <path class="edge" d="M 620 293 L 638 330"/>

  <rect class="label-bg" x="210" y="397" width="340" height="27"/>
  <text class="label blue" x="380" y="416">kept: incoming cases c1 and not c1</text>
  <rect class="label-bg" x="40" y="397" width="148" height="27"/>
  <text class="label orange" x="114" y="416">dropped to undef</text>
  <rect class="label-bg" x="572" y="397" width="148" height="27"/>
  <text class="label orange" x="646" y="416">dropped to undef</text>
</svg>
